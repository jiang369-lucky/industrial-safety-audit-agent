# 最小化配置
# 模型路径
model_name_or_path: D:/yolo/Spark-Gated MoE Framework/model/Qwen3-VL-4B-Instruct
# 信任远程代码，允许加载Qwen3-VL的自定义模型结构
trust_remote_code: true

# 使用监督微调
stage: sft
finetuning_type: lora
lora_target: all

# 使用dataset_info.json中注册的数据集名称
dataset: industrial_safety_weld
# 对话模板：qwen3_vl表示使用Qwen3-VL的推理模板（带<think>标签）
# 如果想用普通模板，改成 qwen3_vl_nothink
template: qwen3_vl
# 截断长度：文本最长1024个token，超过的会被截断
cutoff_len: 1024

# 验证集配置
val_size: 0.2                     # 20% 数据作为验证集（16条）
per_device_eval_batch_size: 1     # 验证时的批大小
eval_strategy: steps              # 验证策略：steps 或 epoch
eval_steps: 48                   # 最后验证一次
eval_accumulation_steps: 1        # 验证时梯度累积步数

# 训练参数
# 每张卡每次处理1条数据（8GB显存只能跑1）
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
# 学习率 0.0002，LoRA的标准值
learning_rate: 2.0e-4
# 训练1轮（epoch），20步就是1轮
# 总步数 = (数据量 × 轮数) ÷ (批处理大小 × 梯度累积)
#       = (80 × 1) ÷ (1 × 4)
#       = 80 ÷ 4 = 20步
num_train_epochs: 3.0
# 使用bfloat16混合精度，省显存、加速
bf16: true

# 视觉参数
# 图像最大像素数 262144 = 512×512，大于这个尺寸的图片会被压缩
image_max_pixels: 262144
# 图像最小像素数 4096 = 64×64，小于这个尺寸的图片会被放大
image_min_pixels: 4096
# 数据加载线程数=0，避免Windows下的死锁问题
dataloader_num_workers: 0
# 保留数据集中的所有列，防止预处理时丢失图像路径
remove_unused_columns: false

# 关键修复
# 执行训练
do_train: true
# 不执行验证
do_eval: true
# 覆盖输出目录，每次重新训练清空上次结果
overwrite_output_dir: true
# 训练结果保存路径
output_dir: saves/qwen3-vl-3epoch
# 每1步打印一次日志，你现在看到的每步输出就是这里控制的
logging_steps: 1
# 不保存中间检查点（小数据集不需要）
save_strategy: "no"
# 不向wandb等平台上报结果
report_to: "none"

# 验证完成后输出详细指标
include_num_input_tokens_seen: true         # 输出loss + 预测结果 + 准确率等
prediction_loss_only: false                 # 从训练开始到现在，模型总共处理过的token数量